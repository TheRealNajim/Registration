<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Welcome Back</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card login-box">
            <div class="card-header">
                <div class="icon-badge">🔐</div>
                <h1>Welcome Back</h1>
                <p class="subtitle">Enter your details to access your account</p>
            </div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-pw" id="togglePw" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span>Sign In 🔑</span>
                </button>
                <div class="form-error-msg" id="errorMsg"></div>
            </form>

            <div class="card-footer">
                Don't have an account? <a href="Registration.html">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePwBtn = document.getElementById('togglePw');
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        // Toggle Password Visibility
        togglePwBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePwBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Verify Credentials against LocalStorage
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.textContent = '';

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password.';
                return;
            }

            const users = JSON.parse(localStorage.getItem('auth_users') || '[]');
            const userMatch = users.find(u => u.email === email && u.password === password);

            if (userMatch) {
                localStorage.setItem('current_user', JSON.stringify(userMatch));
                window.location.href = 'loginsuccessful.html';
            } else {
                // If demo user or empty, create default demo access
                if (users.length === 0) {
                    const demoUser = { fname: 'Demo', lastname: 'User', email: email };
                    localStorage.setItem('current_user', JSON.stringify(demoUser));
                    window.location.href = 'loginsuccessful.html';
                } else {
                    errorMsg.textContent = 'Invalid email or password. Please try again.';
                }
            }
        });
    </script>
</body>
</html>
