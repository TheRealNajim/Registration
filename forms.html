<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Forms </title>
</head>
<body>
    <form action="">

        <div>
            <label for="fname">First Name:</label>
            <input type="text" name="fname">
        </div>
<div>
    <label for="lastname"> Last Name:</label>
    <input type="text" name="lastname" >
</div>
        <div>
            <label for="email">
                Email:
            </label>
            <input type="email" name="email">
        </div>
        <div>
            <label for="pnumber">Phone Number:</label>
            <input type="number" name="pnumber">
        </div>
        <div>
            <label for="fate of birth">Date of Birth</label>
            <input type="date" name="date" id="">
        </div>
        <div>
             <label for="car">Chose your car</label>
             <select name="car" id="car">
                <option value="lamborghini">Lamborghini</option>
                <option value="ferrari">Ferrrari</option>
                <option value="audi">Audi</option>
                <option value="bmw">BMW</option>
                <option value="mercedes benz">Mercedes Benz</option>
             </select>
             <div>
                <input type="checkbox" name="car" id="car">
                <label for="i have a car">I have a car</label> <br>
                <input type="checkbox" name="motorcycle" id="motorcycle">
                <label for="i have a motorcycle">I have a motorcycle</label> <br>
                <input type="checkbox" name="bike" id="bike">
                <label for="i have a bike">I have a bike</label> <br>
             </div>
             <div>
                <input type="text" placeholder="write something about yourself" 
             </div>
             <div>
                <label for="colour">What's your favourite colour</label> <br>
                <input type="radio" name="lang" id="">
                <label for="black">Black</label> <br>
                <input type="radio" name="lang" id="">
                <label for="white">White</label> <br>
                <input type="radio" name="lang" id="">
                <label for="black & white">Black & White</label> <br>
             </div>
             <div>
                <label for="upload a document">Upload a Document</label>
                <input type="file">
             </div>
             <div>
                <label for="why did you chose me?">why did you chose me?</label><br>
                <textarea name="" id="" >I chose you because</textarea>
             </div>
             <div>
                <input type="reset" value="reset"><br>
                <input type="submit" value="Submit">
                </div>
            </form>
            </body>
</html>
