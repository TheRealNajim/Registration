<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najimdeen</title>
</head>
<body>
    <form action="">
        <table>
            <tr>
                <td>
                    <label for="fname">First Name:</label>
                </td>
                <td>
                    <input type="text" name="fname" required >
                </td>
            </tr>
            <tr>
                <td><label for="lastname"> Last Name:</label></td>
                <td> <input type="text" name="lastname" required ></td>
            </tr>
            <tr>
                <td>  <label for="pnumber">Phone Number:</label></td>
                <td> <input type="pnumber" name="pnumber" required></td>
            </tr>
            <tr>
                <td> <label for="date of birth">Date of Birth</label></td>
                <td> <input type="date" name="date" max="2015-01-01" min="1995-01-01" id="" required ></td>
            </tr>
            <tr>
                <td> <label for="car">Chose your car</label></td>
                <td><select name="car" id="car" required >
                    <option value="lamborghini">Lamborghini</option>
                    <option value="ferrari">Ferrrari</option>
                    <option value="audi">Audi</option>
                    <option value="bmw">BMW</option>
                    <option value="mercedes benz">Mercedes Benz</option></td>
            </tr>
            <tr>
                <td>  <input type="checkbox" name="car" id="car">
                    <label for="i have a car">I have a car</label> <br>
                    <input type="checkbox" name="motorcycle" id="motorcycle">
                    <label for="i have a motorcycle">I have a motorcycle</label> <br>
                    <input type="checkbox" name="bike" id="bike">
                    <label for="i have a bike">I have a bike</label> <br></td>
            </tr>
            <tr>
                <td><input type="text" placeholder="write something about yourself" required </td>
            </tr>
            <tr>
               <td> <label for="colour">What's your favourite colour</label> <br></td>
            </tr>
            <tr>
                <td> <input type="radio" name="lang" id="" required >
                    <label for="black">Black</label> <br>
                    <input type="radio" name="lang" id="" required >
                    <label for="white">White</label> <br>
                    <input type="radio" name="lang" id="" required >
                    <label for="black & white">Black & White</label> <br></td>
            </tr>
            <tr>
                <td><label for="upload a document">Upload a Document</label></td>
            </tr>
            <tr>
                <td><input type="file" required ></td>
            </tr>
            <tr>
                <td><label for="why did you chose me?">why did you chose the
                      colour <br> you chose above?</label><br></td>
            </tr>
            <tr>
            <td> <textarea name="" id="" >I chose it because</textarea></td>
           </tr>
            <tr>
                <td><input type="reset" value="reset"><br></td>
            </tr>
            <tr>
                <td> <input type="submit" value="Submit"></td>
            </tr>
        </table>
    </form>
</body>
</html>
