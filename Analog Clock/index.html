<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Analog & Digital Clock</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <div class="app-container">
        <!-- Control Header -->
        <header class="controls-bar">
            <div class="control-group">
                <label for="themeSelect" class="control-label">Theme</label>
                <select id="themeSelect" class="control-select">
                    <option value="dark">Dark Luxury</option>
                    <option value="light">Nordic Light</option>
                    <option value="cyber">Cyber Neon</option>
                    <option value="emerald">Emerald Gold</option>
                </select>
            </div>

            <div class="control-group">
                <label for="timezoneSelect" class="control-label">Timezone</label>
                <select id="timezoneSelect" class="control-select">
                    <option value="local">Local Time</option>
                    <option value="UTC">UTC / GMT</option>
                    <option value="Europe/London">London (GMT/BST)</option>
                    <option value="America/New_York">New York (EST/EDT)</option>
                    <option value="Asia/Tokyo">Tokyo (JST)</option>
                    <option value="Australia/Sydney">Sydney (AEST/AEDT)</option>
                </select>
            </div>

            <div class="toggle-buttons">
                <button id="motionToggle" class="btn-toggle" title="Toggle Smooth / Step Ticking">
                    <span class="btn-icon">⚡</span>
                    <span class="btn-text" id="motionText">Smooth</span>
                </button>
                <button id="formatToggle" class="btn-toggle" title="Toggle 12h / 24h Digital Format">
                    <span class="btn-icon">🕒</span>
                    <span class="btn-text" id="formatText">12H</span>
                </button>
                <button id="soundToggle" class="btn-toggle" title="Toggle Audio Tick Sound">
                    <span class="btn-icon" id="soundIcon">🔇</span>
                    <span class="btn-text" id="soundText">Mute</span>
                </button>
            </div>
        </header>

        <!-- Main Clock Card -->
        <main class="clock-card">
            <!-- Analog Clock Face -->
            <div class="clock-wrapper">
                <div class="clock-face" id="clockFace">
                    <!-- Ticks & Numbers SVG rendered dynamically -->
                    <svg class="ticks-svg" viewBox="0 0 300 300" id="ticksSvg"></svg>

                    <!-- Clock Hands -->
                    <div class="hand hr-hand" id="hrHand"></div>
                    <div class="hand min-hand" id="minHand"></div>
                    <div class="hand sec-hand" id="secHand"></div>
                    <div class="center-cap"></div>
                </div>
            </div>

            <!-- Digital Sub-Display -->
            <div class="digital-display">
                <div class="digital-time-row">
                    <div class="digital-time" id="digitalTime">00:00:00</div>
                    <div class="digital-ampm" id="digitalAmPm">AM</div>
                </div>
                <div class="digital-date" id="digitalDate">Loading date...</div>
                <div class="timezone-badge" id="timezoneBadge">LOCAL</div>
            </div>
        </main>

        <footer class="app-footer">
            <span>Precision Analog Clock • Web Audio Synthesizer</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
